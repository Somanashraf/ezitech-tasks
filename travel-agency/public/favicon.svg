<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="wanderluxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Background -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#wanderluxGrad)" />

  <!-- Globe & Compass Vector Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe Circle -->
    <circle cx="50" cy="50" r="30" />
    <!-- Equator -->
    <line x1="20" y1="50" x2="80" y2="50" />
    <!-- Meridians -->
    <ellipse cx="50" cy="50" rx="14" ry="30" />
    <!-- Compass Pointer Accent -->
    <path d="M50 20 L58 38 L50 34 L42 38 Z" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
